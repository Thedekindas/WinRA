name: Build WinRA for macOS Catalina (10.15)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build macOS Catalina DMG & PKG
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install official Python 3.11 with macOS 10.9+ baseline
        run: |
          echo "Downloading official Python 3.11.9 universal2 installer from python.org..."
          curl -sSL -o python-3.11.9-macos11.pkg https://www.python.org/ftp/python/3.11.9/python-3.11.9-macos11.pkg
          sudo installer -pkg python-3.11.9-macos11.pkg -target /
          rm -f python-3.11.9-macos11.pkg
          /Library/Frameworks/Python.framework/Versions/3.11/bin/python3 --version

      - name: Run Catalina Build Script
        env:
          PYTHON_BIN: /Library/Frameworks/Python.framework/Versions/3.11/bin/python3
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          chmod +x build_catalina.sh build_pkg.sh
          ./build_catalina.sh

      - name: Verify DMG integrity
        run: |
          hdiutil imageinfo WinRA-Catalina-10.15.dmg
          ls -la WinRA-Catalina-10.15.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinRA-Catalina-10.15-DMG
          path: WinRA-Catalina-10.15.dmg
          if-no-files-found: error

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinRA-Catalina-10.15-PKG
          path: WinRA-Catalina-10.15.pkg
          if-no-files-found: warn

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0-catalina --yes 2>/dev/null || true
          git tag -d v1.0-catalina 2>/dev/null || true
          git push origin :refs/tags/v1.0-catalina 2>/dev/null || true
          gh release create v1.0-catalina \
            WinRA-Catalina-10.15.dmg \
            WinRA-Catalina-10.15.pkg \
            --title "WinRA v1.0 - macOS Catalina (10.15)" \
            --notes "Instalador compatible con macOS Catalina 10.15 (Intel x86_64). Incluye formato DMG HFS+ y utilidades unar/lsar integradas."
